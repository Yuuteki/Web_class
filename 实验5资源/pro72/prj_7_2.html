<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书馆读者调查问卷</title>
    <style>
        body {
            margin: 0;
            padding: 8px 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background-color: #fff;
            color: #000;
        }

        .survey-wrap {
            width: 700px;
            margin: 0 auto;
            padding: 10px;
            background-color: #ffc6ff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
        }

        td {
            border: 1px solid #ff99ff;
            padding: 6px;
            vertical-align: top;
            font-size: 16px;
            line-height: 1.45;
        }

        .title {
            height: 58px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .intro {
            text-indent: 2em;
        }

        .question {
            margin-bottom: 5px;
        }

        .text-input {
            width: 390px;
            height: 20px;
            box-sizing: border-box;
        }

        .short-input {
            width: 150px;
            height: 22px;
            box-sizing: border-box;
        }

        select {
            height: 24px;
        }

        label {
            display: block;
            margin: 2px 0;
        }

        textarea {
            width: 580px;
            height: 78px;
            resize: none;
            box-sizing: border-box;
        }

        .actions {
            text-align: center;
        }

        .actions input {
            margin: 0 8px;
        }
    </style>
</head>
<body>
    <div class="survey-wrap">
        <form action="#" method="post">
            <table>
                <tr>
                    <td class="title">图书馆读者调查问卷</td>
                </tr>
                <tr>
                    <td class="intro">
                        为了能够及时了解您对图书馆的需求，提升我校图书馆文献资源建设的质量和水平，更好的为我校教学科研服务，我馆特设计了问卷调查题目如下，请协助填写，谢谢您的合作！
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="question">1. 您的年级</div>
                        <label>
                            请你选择：
                            <select name="grade" value="请选择">
                                <option value="请选择">请你选择</option>
                                <option value="大一">大一</option>
                                <option value="大二">大二</option>
                                <option value="大三">大三</option>
                                <option value="大四">大四</option>
                            </select>
                        </label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="question">2. 您的专业</div>
                        <input class="text-input" type="text" name="major" value="">
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="question">3. 对于图书馆的浏览环境</div>
                        <label><input type="radio" name="environment" value="满意">满意</label>
                        <label><input type="radio" name="environment" value="基本满意">基本满意</label>
                        <label><input type="radio" name="environment" value="不满意">不满意，您的建议： <input class="short-input" type="text" name="environment_suggestion" value=""></label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="question">4. 您到图书馆的原因是（可多选）：</div>
                        <label><input type="checkbox" name="reason" value="借阅专业图书">借阅专业图书</label>
                        <label><input type="checkbox" name="reason" value="随便坐坐翻翻书刊">随便坐坐，翻翻书刊</label>
                        <label><input type="checkbox" name="reason" value="借阅光盘">借阅光盘</label>
                        <label><input type="checkbox" name="reason" value="参加图书馆组织的活动">参加图书馆组织的活动</label>
                        <label><input type="checkbox" name="reason" value="自习复习功课">自习，复习功课</label>
                        <label><input type="checkbox" name="reason" value="上网">上网</label>
                        <label><input type="checkbox" name="reason" value="检索电子文献">检索电子文献</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="question">5. 您到图书馆的频率</div>
                        <label><input type="radio" name="frequency" value="几乎每天">几乎每天</label>
                        <label><input type="radio" name="frequency" value="每周1-2次">每周1-2次</label>
                        <label><input type="radio" name="frequency" value="每月1-2次">每月1-2次</label>
                        <label><input type="radio" name="frequency" value="几乎不去">几乎不去</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="question">6. 您对学校的建议</div>
                        <textarea name="school_suggestion" value="" placeholder="请您提出宝贵建议："></textarea>
                    </td>
                </tr>
                <tr>
                    <td class="actions">
                        <input type="submit" name="submit_btn" value="提交答案">
                        <input type="reset" name="reset_btn" value="清空">
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
